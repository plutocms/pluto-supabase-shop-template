name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This template has never had a lint or typecheck script, so a
      # hardcoded `bun run typecheck` here always failed. Probe instead, so
      # adding a script later automatically enrolls it in CI.
      - name: Run checks
        run: |
          set -euo pipefail
          for script in lint typecheck test build; do
            if node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 1)"; then
              echo "::group::bun run $script"
              bun run "$script"
              echo "::endgroup::"
            else
              echo "no \"$script\" script in package.json — skipped"
            fi
          done
